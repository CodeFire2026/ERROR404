<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>VantuchBikes - Taller de Bicicletas</title>
    <link rel="stylesheet" href="estilos.css">
    <meta name="google-site-verification" content="tFxTwIjyJnGabG2QQOQAhICJwlbb4L-XVZKmzc-hFXQ" />
</head>
<body>

<header>
    <h1>VantuchBikes</h1>
    <p>Taller especializado en reparación y mantenimiento de bicicletas.</p>
</header>



<div class="container">

<section>
    <h2>Nuestros Servicios</h2>
    <ul>
        <li>Reparaciones generales</li>
        <li>Mantenimiento preventivo</li>
        <li>Instalación de accesorios</li>
        <li>Services Base</li>
        <li>Services Intermedio</li>
        <li>Services Completo</li>
    </ul>
</section>

<section>
    <h2>Reserva tu Turno</h2>

    <form>
        <label>Nombre</label>
        <input type="text" required>

        <label>Apellido</label>
        <input type="text" required>

        <label>Teléfono</label>
        <input type="tel" required>

        <label>Fecha del turno</label>
        <input type="date" required>

        <label>Hora </label>
        <input type="time" required>

        <label>¿Qué necesita tu bicicleta?</label>
        <textarea rows="4" placeholder="Ej: cambios no funcionan, frenos flojos, service general..." required></textarea>

        <button type="submit">Reservar turno</button>
    </form>
</section>

<div class="container">
    <!-- todo tu contenido -->
</div>

</div>

</body>

</body>
</html>
